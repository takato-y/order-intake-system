name: test

on:
  push:
    branches: [main]
  pull_request:

# テストはリポジトリを読むだけなので、トークンの権限を読み取りに限定する
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # n8n のスキーマ検証ノード（JavaScript）を Python 側と突き合わせるテストで使う
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements-dev.txt
      - run: python tools/build_n8n_workflow.py && git diff --exit-code n8n/order-intake.json
      - run: python -m pytest -v
