# 確認用の起動定義。
#   API だけ:        docker compose up -d --build
#   n8n も起動する:  docker compose --profile n8n up -d --build
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # 既定は規則抽出（LLM なしで動く）。LLM を使う場合は auto にし、OLLAMA_URL を指定する
      EXTRACTOR_MODE: ${EXTRACTOR_MODE:-rule}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
    volumes:
      - order-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:2.3.5
    profiles: ["n8n"]
    ports:
      - "5678:5678"
    environment:
      GENERIC_TIMEZONE: Asia/Tokyo
      TZ: Asia/Tokyo
    volumes:
      - n8n-data:/home/node/.n8n
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - api

volumes:
  order-data:
  n8n-data:
